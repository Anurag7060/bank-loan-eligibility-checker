services:
  - type: web
    name: zenith-loan-eligibility-portal
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt || true
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: ADMIN_EMAIL
        value: anurag130806@gmail.com
